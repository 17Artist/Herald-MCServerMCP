[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/auth",
    "crates/runtime",
    "crates/mcserver",
    "crates/rcon",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["17Artist"]
license = "GPL-3.0-only"
repository = "https://github.com/17Artist/Herald-MCServerMCP"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# serde stack
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# error handling
anyhow = "1"
thiserror = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# crypto / random
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
base32 = "0.5"
base64 = "0.22"
zeroize = "1"

# uuid + time
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# http stack
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tower-cookies = "0.10"
http = "1"
mime_guess = "2"

# embed static
rust-embed = { version = "8", features = ["mime-guess"] }

# in-workspace
herald-mcserver-core = { path = "crates/core" }
herald-mcserver-auth = { path = "crates/auth" }
herald-mcserver-runtime = { path = "crates/runtime" }
herald-mcserver-mcserver = { path = "crates/mcserver" }
herald-mcserver-rcon = { path = "crates/rcon" }

# extra deps for runtime + mcserver
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
which = "6"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
