[server]
listen = "0.0.0.0:9999"
public_url = "http://localhost:9999"
data_dir = "./data2"

[mc]
default_version = "1.20.1"
heap_mb = 2048
server_port = 25566
rcon_port = 25576

[runtime]
auto_install_java = true
auto_install_paper = true
mirror = "default"

[security]
session_ttl_secs = 2592000

[mcp]
enabled = true
require_api_key = true
