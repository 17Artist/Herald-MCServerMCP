<!--
  Herald MCServerMCP Logo

  设计：
    - 中央：等距投影立方体（Minecraft 像素方块的极简化），顶面用紫蓝渐变
      表"被代行的服务端"在线接受指令
    - 立方体外三道呈放射状的开口弧 —— 服务端"心跳"波纹（脉冲）
    - 外圈：与 Herald 同款的印鉴断口环，保留 36/6 dash 节奏，强调"代行"血统
    - 渐变色：c4b5fd → a78bfa → 38bdf8（与 Herald 完全一致）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hg" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="hgTop" x1="20" y1="18" x2="44" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="hgRing" cx="50%" cy="50%" r="50%">
      <stop offset="0.65" stop-color="transparent"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <!-- 印鉴外环：上下左右各留缺口（与 Herald 视觉血统一致） -->
  <circle cx="32" cy="32" r="28" fill="url(#hgRing)"/>
  <path d="M 32 4
           A 28 28 0 0 1 60 32
           M 60 32
           A 28 28 0 0 1 32 60
           M 32 60
           A 28 28 0 0 1 4 32
           M 4 32
           A 28 28 0 0 1 32 4"
        stroke="url(#hg)" stroke-width="1.6" stroke-linecap="round"
        stroke-dasharray="36 6" fill="none"/>

  <!-- 内圈细环 -->
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="url(#hg)" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- 心跳波纹（三道，越往外越淡）：表"服务端在线" -->
  <path d="M 14 32 A 18 18 0 0 1 32 14"
        stroke="url(#hg)" stroke-width="1.2" stroke-linecap="round"
        stroke-opacity="0.7" fill="none"/>
  <path d="M 50 32 A 18 18 0 0 1 32 50"
        stroke="url(#hg)" stroke-width="1.2" stroke-linecap="round"
        stroke-opacity="0.7" fill="none"/>

  <!--
    等距立方体（中心 32,33；边长 9）：
      顶面（菱形）：(32,21) → (43,27) → (32,33) → (21,27)
      左面：(21,27) → (32,33) → (32,45) → (21,39)
      右面：(43,27) → (32,33) → (32,45) → (43,39)
  -->
  <!-- 顶面 -->
  <path d="M 32 21 L 43 27 L 32 33 L 21 27 Z"
        fill="url(#hgTop)" fill-opacity="0.95"
        stroke="url(#hg)" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- 左面（深一档） -->
  <path d="M 21 27 L 32 33 L 32 45 L 21 39 Z"
        fill="#a78bfa" fill-opacity="0.16"
        stroke="url(#hg)" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- 右面 -->
  <path d="M 43 27 L 32 33 L 32 45 L 43 39 Z"
        fill="#38bdf8" fill-opacity="0.10"
        stroke="url(#hg)" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- 顶面正中"信号点"：服务端心跳 -->
  <circle cx="32" cy="27" r="1.6" fill="#0a0a0c"/>
  <circle cx="32" cy="27" r="0.9" fill="#c4b5fd"/>
</svg>
